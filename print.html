<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>簽名核對列印（給各班導師）</title>
<link rel="stylesheet" href="css/style.css?v=14">
<style>
/* ---- 列印版專用樣式（螢幕外觀） ---- */
#print-root .class-block{border:1px solid #e2e8f0;border-radius:8px;margin:14px 0;padding:10px 14px}
#print-root .class-block h2{margin:0 0 4px;font-size:16px}
.cls-summary{font-size:13px;color:#64748b;margin:0 0 8px}
#print-root table th,#print-root table td{text-align:center}
#print-root table td{padding:3px 5px}
/* 一班切成左右兩欄並排，30 人也能縮在兩面 A4 內 */
#print-root .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;align-items:start}
#print-root .cols table{width:100%;table-layout:fixed}
/* 固定欄寬：學號 6 碼、座號 2 碼、選項 同意/不同意/未填寫、簽名佔其餘 */
#print-root .cols col.c1{width:17%}
#print-root .cols col.c2{width:10%}
#print-root .cols col.c3{width:23%}
#print-root .cols col.c4{width:50%}
#print-root .cols td{box-sizing:border-box;height:60px;padding:4px 5px;overflow:hidden}
#print-root .cols tbody tr{height:60px}
#print-root .cols td.c1,#print-root .cols td.c2{white-space:nowrap}
.teacher-footer{display:flex;justify-content:space-between;align-items:flex-start;margin-top:6px;page-break-inside:avoid}
.teacher-sign{margin:30px 0 0;font-size:14px;color:#1e293b}
.teacher-sign .sign-line{display:inline-block;width:14em;border-bottom:1px solid #94a3b8}
.security-note{margin:0;font-size:11.5px;color:#b91c1c}
.sigl img{height:52px;max-width:100%;width:auto;border:0;border-radius:4px;object-fit:contain;vertical-align:middle}
.sigl.pending{display:inline-block;height:52px;width:100%}
.err{color:#b91c1c;font-size:12px}
.sigl .sig-err{display:none;color:#dc2626;font-size:11px}
.sigl.bad img{display:none}
.sigl.bad .sig-err{display:inline;color:#dc2626;font-size:11px}
/* 紙本列：簽名欄顯示可點開掃描檔的「紙本」連結，不是 ── 簽名圖 */
.sigl.paper{display:inline-block;padding:2px 8px;border:1px solid #3b82f6;border-radius:10px;
  color:#2563eb;font-size:12px;text-decoration:none;background:#eff6ff}
/* ---- 工具區（同步掃描＋紙本表單選取；螢幕顯示，列印隱藏） ---- */
.tools-wrap{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.tool-block{border:1px solid #d1d5db;border-radius:10px;padding:12px 14px}
.tool-block h3{margin:0 0 6px;font-size:15px}
.tool-block .hint{font-size:12.5px;color:#64748b;margin:0 0 8px}
.tool-block .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sync-result{font-size:13px;color:#1e293b}
.sync-result .err{display:block;color:#b91c1c}
.sel-list{margin-top:10px;max-height:300px;overflow:auto;border:1px solid #e2e8f0;border-radius:8px;padding:6px 10px}
.sel-cls{font-size:13px;color:#334155;margin:8px 0 2px;padding-bottom:2px;border-bottom:1px solid #e2e8f0}
.sel-cls b{color:#0f172a}
.sel-item{display:inline-flex;align-items:center;gap:4px;margin:2px 14px 2px 0;font-size:13px;font-weight:400;white-space:nowrap}
.sel-item.checked{background:#eff6ff}
.sel-item .na{color:#94a3b8}
.sel-item .ok{color:#166534}
.sel-item .no{color:#991b1b}
/* ---- 紙本表單（A4 直式，只出現在列印中；螢幕一律隱藏） ---- */
#paper-root{display:none}
@media print{
  #paper-root{display:none}
  body.paper .print-tools, body.paper h1, body.paper .sub, body.paper #summary,
  body.paper .credit, body.paper #print-root{display:none!important}
  body.paper #paper-root{display:block;padding:0}
  body.paper{max-width:none;padding:0}
  .paper-form{page-break-after:always;page-break-inside:avoid}
  .paper-form:last-child{page-break-after:auto}
  .paper-form h2{font-size:20px;text-align:center;margin:0 0 16px;color:#111827}
  .pf-id{font-size:15px;margin:0 0 12px;white-space:nowrap}
  .pf-blank{display:inline-block;border-bottom:1px solid #000;color:#000}
  .pf-id .pf-blank{min-width:6em}
  .pf-sign .pf-blank{min-width:13em;height:1em;vertical-align:bottom}
  .paper-form .consent{font-size:13.5px;line-height:1.9;color:#000;background:#fff;
    border:1px solid #94a3b8;white-space:pre-wrap;padding:12px 16px;margin:10px 0}
  .pf-check,.pf-choice{font-size:17px;margin:14px 0;color:#000}
  .pf-check .ck,.pf-choice .ck{display:inline-block;font-size:22px;font-weight:700;color:#000;padding:0 4px}
  .pf-sign{border:1px dashed #64748b;border-radius:8px;padding:14px 16px;margin:18px 0;min-height:150px}
  .pf-sign p{margin:72px 0 0;font-size:16px}
  .pf-date{font-size:13px;color:#111827;text-align:right;margin:14px 0 0}
}
@media print{
  .print-tools{display:none}
  h1,.sub,#summary{display:none}
  body{padding:0}
  .credit{display:none}
  #print-root .class-block{break-before:page;border:0;padding:0;margin:0}
  #print-root .class-block:first-of-type{break-before:auto}
  .cls-summary{page-break-after:avoid}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
  .cols table{width:100%}
  table{font-size:12px;page-break-inside:auto}
  tr{page-break-inside:avoid}
  .teacher-footer{page-break-inside:avoid}
  .sigl img{print-color-adjust:exact;-webkit-print-color-adjust:exact;break-inside:avoid}
}
</style>
</head>
<body class="teacher">

<h1>肖像權同意書簽名核對（列印版）</h1>
<p class="sub">每班獨立一頁；印出後交給各班導師補簽於空白處</p>

<div class="filters print-tools">
  <select id="grade" onchange="gradeChange()"><option value="">全部年級</option></select>
  <select id="cls" onchange="clsChange()"><option value="">全部班級</option></select>
  <select id="dec"><option value="">全部選項</option><option>同意</option><option>部分同意</option><option>條件同意</option><option>不同意</option><option>未填寫</option></select>
  <button class="btn" onclick="doPrint()">列印所有班級</button>
</div>

<!-- 工具區：紙本掃描同步＋簽署用紙本列印（列印時隱藏） -->
<div class="tools-wrap print-tools">
  <div class="tool-block">
    <h3>紙本掃描同步</h3>
    <p class="hint">將紙本簽署後的掃描檔放進「肖像權同意-掃描影像」資料夾（與試算表同一層），檔名：<b>學號_同意或不同意_西元YYYY-MM-DD</b>（例：112001_同意_2026-09-15.jpg），再點下方同步。成功筆數立即進入總表；失敗筆數與原因記錄在「掃描處理紀錄」分頁，不會汙染總表。</p>
    <div class="row">
      <button class="btn" onclick="doSync()">同步掃描檔</button>
      <span id="syncResult" class="sync-result"></span>
    </div>
  </div>
  <div class="tool-block">
    <h3>列印簽署用紙本</h3>
    <p class="hint">勾選要發紙本表單給家長的學生（每位學生一張 A4 直式），點「列印」即套印。學生回家簽妥後收回掃描建檔，再回來做「紙本掃描同步」。</p>
    <div class="row">
      <button class="btn light" onclick="selAll()">全選</button>
      <button class="btn light" onclick="selUnsigned()">僅未簽署</button>
      <button class="btn light" onclick="selClear()">清空</button>
      <button class="btn" onclick="doPaperPrint()">列印簽署用紙本（<span id="selCount">0</span> 張）</button>
    </div>
    <div id="selStudents" class="sel-list"><p class="hint">資料載入中…</p></div>
  </div>
</div>

<div id="summary"></div>
<div id="print-root"></div>
<div id="paper-root"></div>

<p class="credit"><a href="https://sites.google.com/view/roats1000" target="_blank" rel="noopener">開發者：資訊組張佑正</a></p>

<script src="js/config.js?v=14"></script>
<script src="js/content.js?v=2"></script>
<script src="js/api.js?v=14"></script>
<script src="js/print.js?v=17"></script>

</body>
</html>
