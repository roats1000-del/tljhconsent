<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>簽名核對列印（給各班導師）</title>
<link rel="stylesheet" href="css/style.css?v=3">
<style>
/* ---- 列印版專用樣式（螢幕外觀） ---- */
#print-root .class-block{border:1px solid #e2e8f0;border-radius:8px;margin:14px 0;padding:10px 14px}
#print-root .class-block h2{margin:0 0 4px;font-size:16px;text-align:center}
.cls-summary{font-size:13px;color:#64748b;margin:0 0 8px;text-align:center}
#print-root table th,#print-root table td{text-align:center}
.sigl img{height:40px;max-width:170px;border:1px solid #e2e8f0;border-radius:4px;object-fit:contain;vertical-align:middle}
.sigl .sig-err{display:none;color:#dc2626;font-size:11px}
.sigl.bad img{display:none}
.sigl.bad .sig-err{display:inline;color:#dc2626;font-size:11px}
@media print{
  .print-tools{display:none}
  h1,.sub,#summary{display:none}
  body{padding:0}
  .credit{display:none}
  #print-root .class-block{break-before:page;border:0;padding:0;margin:0}
  #print-root .class-block:first-of-type{break-before:auto}
  .cls-summary{page-break-after:avoid}
  table{font-size:12px;page-break-inside:auto}
  tr{page-break-inside:avoid}
  .sigl img{print-color-adjust:exact;-webkit-print-color-adjust:exact;break-inside:avoid}
}
</style>
</head>
<body class="teacher">

<h1>肖像權同意書簽名核對（列印版）</h1>
<p class="sub">每班獨立一頁；印出後交給各班導師補簽於空白處</p>

<div class="filters print-tools">
  <select id="grade" onchange="gradeChange()"><option value="">全部年級</option></select>
  <select id="cls"><option value="">全部班級</option></select>
  <select id="dec"><option value="">全部選項</option><option>同意</option><option>不同意</option><option>未填寫</option></select>
  <button class="btn" onclick="doPrint()">列印所有班級</button>
</div>
<div id="summary"></div>
<div id="print-root"></div>

<p class="credit"><a href="https://sites.google.com/view/roats1000" target="_blank" rel="noopener">開發者：資訊組張佑正</a></p>

<script src="js/config.js?v=3"></script>
<script src="js/api.js?v=3"></script>
<script src="js/print.js?v=3"></script>

</body>
</html>
