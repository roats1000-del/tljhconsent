<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>學生肖像權使用同意書</title>
<link rel="stylesheet" href="css/style.css?v=3">
</head>
<body class="parent">

<h1><span id="schoolName"></span> 學生肖像權使用同意書</h1>

<div id="formWrap">
<form onsubmit="return beforeSubmit(event)">
  <!-- 資安防護：Honeypot（人類看不到、bot 會誤填；後端檢測即整筆丟棄） -->
  <div style="position:absolute;left:-9999px;top:-9999px" aria-hidden="true">
    <label>請不要填寫此欄：<input type="text" name="hp" id="hp" tabindex="-1" autocomplete="off"></label>
  </div>

  <div class="box">
    <h2>一、驗證與身分</h2>
    <label>學生學號</label>
    <input type="text" id="sid" required>
    <label>學生姓名</label>
    <input type="text" id="name" required>
    <label>與學生關係</label>
    <select id="rel" required>
      <option value="">請選擇</option>
      <option value="父親">父親</option>
      <option value="母親">母親</option>
      <option value="祖父、祖母">祖父、祖母</option>
      <option value="其它/監護人">其它/監護人</option>
    </select>
  </div>

  <div class="box">
    <h2>二、同意書內容</h2>
    <div class="consent" id="consentText"></div>

    <label><input type="checkbox" id="read" value="我已閱讀"> 本人已詳閱並了解上述同意書內容</label>

    <label>本人與學生選擇</label>
    <label><input type="radio" name="choice" value="同意"> 同意</label>
    <label><input type="radio" name="choice" value="不同意"> 不同意</label>
  </div>

  <div class="box">
    <h2>三、簽名區</h2>
    <label>簽署人姓名</label>
    <input type="text" id="signer" required>
    <label>親筆簽名（手指或滑鼠於框內簽名）</label>
    <canvas id="sig"></canvas>
    <button type="button" class="btn light" onclick="clearSig()">清除重簽</button>
    <div class="hint">您於此框手寫簽名，即視同您本人之電子簽署。</div>
    <div class="err" id="err"></div>
  </div>

  <button type="submit" class="btn">送出</button>
</form>
</div>

<div id="result" style="display:none"></div>

<script src="js/config.js?v=4"></script>
<script src="js/content.js?v=1"></script>
<script src="js/api.js?v=4"></script>
<script src="js/app.js?v=5"></script>
<script>document.getElementById('consentText').textContent = CONSENT_TEXT;</script>

</body>
</html>
